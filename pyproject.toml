[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexttoken-core"
version = "0.2.0"
description = "Universal n-th order Markov chain over arbitrary hashable tokens"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
